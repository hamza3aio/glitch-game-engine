<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glitch Game Engine — Showcase</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <canvas id="game"></canvas>
      <div id="hud">
        <div><strong>GLITCH SHOWCASE</strong> <span>v1.2</span></div>
        <div id="stats">— fps</div>
        <div id="help">WASD move · Space jump · Mouse-drag orbit · R reset</div>
      </div>
      <div id="toast"></div>
      <div id="menu" style="display:none;">
        <div id="menu-left">
          <div id="m-title">GLITCH</div>
          <div id="m-version">v1.2.0</div>
          <button id="m-continue">Enter World</button>
          <button id="m-new">Enter World</button>
          <button id="m-settings">Settings</button>
          <button id="m-credits">Credits</button>
          <button id="m-quit">Quit</button>
          <div id="m-note"></div>
        </div>
      </div>
      <div id="loading" style="display:none;">
        <div id="loadbox">
          <div id="loadtitle">GLITCH</div>
          <div id="loadbar"><div id="loadfill"></div></div>
          <div id="loadlabel">Starting…</div>
          <div id="loadtip"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
